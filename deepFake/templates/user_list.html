{% extends 'base.html' %}

{% block content %}
<div class="min-h-screen flex items-center justify-center">
    <div class="max-w-3xl p-8 bg-white shadow-md rounded-lg">

        <!-- Title -->
        <h2 class="text-3xl font-bold mb-6 text-center text-gray-800">Registered Users</h2>

        <!-- Table -->
        <div class="overflow-x-auto">
            <table class="w-full border-collapse bg-white shadow-md rounded-lg overflow-hidden">
                <thead class="bg-gradient-to-r from-blue-500 to-purple-500 text-white">
                    <tr>
                        <th class="py-3 px-4 text-left">Username</th>
                        <th class="py-3 px-4 text-left">Email</th>
                        <th class="py-3 px-4 text-left">Date Joined</th>
                        <th class="py-3 px-4 text-center">Actions</th>
                    </tr>
                </thead>
                <tbody class="text-gray-700">
                    {% for user in users %}
                    <tr class="border-b hover:bg-gray-100 transition">
                        <td class="py-3 px-4">{{ user.username }}</td>
                        <td class="py-3 px-4">{{ user.email }}</td>
                        <td class="py-3 px-4">{{ user.date_joined|date:"Y-m-d H:i" }}</td>
                        <td class="py-3 px-4 text-center">
                            <a href="{% url 'user_detail' user.id %}" 
                               class="bg-blue-500 text-white py-2 px-4 rounded-md text-sm font-semibold hover:bg-blue-700 transition">
                                View Profile
                            </a>
                        </td>
                    </tr>
                    {% empty %}
                    <tr>
                        <td colspan="4" class="text-center py-4 text-gray-500">No registered users found</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>

    </div>
</div>
{% endblock %}
