{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}My Site{% endblock %}</title>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="{% static 'style.css' %}">

    <style>
        /* Ensure particles.js covers full viewport */
        #particles-js {
            position: fixed;
            width: 100%;
            height: 100vh;
            top: 0;
            left: 0;
            z-index: -1; /* Send it behind everything */
        }

        /* Ensure navbar is on top */
        nav {
            position: relative;
            z-index: 10;
        }
    </style>

    {% block extra_head %}{% endblock %}
</head>
<body>
    <div id="particles-js"></div>

    <!-- Navbar (Ensures visibility above particles.js) -->
    <nav class="bg-gradient-to-r from-blue-500 to-purple-600 p-4 flex justify-between items-center shadow-lg">
        <a href="/" class="text-white text-lg font-bold">Deep Fake Detection</a>
        {% if user.is_authenticated and user.is_superuser %}
            <a href="{% url 'users' %}" class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded">
                Users
            </a>
        {% endif %}
        {% if user.is_authenticated %}
            <form method="POST" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit" class="bg-red-500 hover:bg-red-700 text-white font-bold py-2 px-4 rounded">
                    Logout
                </button>
            </form>
        {% else %}
        
            <a href="{% url 'login' %}" class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded">
                Login
            </a>
        {% endif %}
    </nav>

    <!-- Page Content -->
    <div class=" mx-auto p-4 relative z-10">
        {% block content %}{% endblock %}
    </div>

    <script src="http://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script src="http://threejs.org/examples/js/libs/stats.min.js"></script>
    <script src="{% static 'particles.js' %}"></script>
</body>
</html>
