{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}My Site{% endblock %}</title>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    
    <link rel="stylesheet" href="{% static 'style.css' %}">

    <style>
        /* Ensure particles.js covers full viewport */
        #particles-js {
            position: fixed;
            width: 100%;
            height: 100vh;
            top: 0;
            left: 0;
            z-index: -1; /* Send it behind everything */
        }

        /* Ensure navbar is on top */
        nav {
            position: relative;
            z-index: 10;
        }
        

    </style>

    {% block extra_head %}{% endblock %}
</head>
<body>
    <div id="particles-js"></div>

    <!-- Navbar (Ensures visibility above particles.js) -->
    <nav class="bg-gradient-to-r from-blue-500 to-purple-600 p-4 shadow-lg">
        <div class="container mx-auto flex justify-between items-center">
            <!-- Logo/Brand -->
            <a href="/" class="text-white text-xl font-bold flex items-center space-x-2 hover:text-blue-100 transition-colors">
                <i class="fas fa-shield-alt"></i>
                <span>DeepFake Detection</span>
            </a>
    
            <!-- Navigation Links -->
            <div class="flex items-center space-x-4">
                {% if user.is_authenticated and user.is_superuser %}
                    <a href="{% url 'users' %}" class="bg-white/20 hover:bg-white/30 text-white font-medium py-2 px-4 rounded-lg transition-all flex items-center space-x-2">
                        <i class="fas fa-users"></i>
                        <span>Users</span>
                    </a>
                {% endif %}
                
                {% if user.is_authenticated %}
                    <form method="POST" action="{% url 'logout' %}">
                        {% csrf_token %}
                        <button type="submit" class="bg-white/10 hover:bg-white/20 text-white font-medium py-2 px-4 rounded-lg transition-all flex items-center space-x-2">
                            <i class="fas fa-sign-out-alt"></i>
                            <span>Logout</span>
                        </button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}" class="bg-white/20 hover:bg-white/30 text-white font-medium py-2 px-4 rounded-lg transition-all flex items-center space-x-2">
                        <i class="fas fa-sign-in-alt"></i>
                        <span>Login</span>
                    </a>
                {% endif %}
            </div>
        </div>
    </nav>

    <!-- Page Content -->
    <div class=" mx-auto relative z-10">
        {% block content %}{% endblock %}
    </div>

    <script src="http://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script src="http://threejs.org/examples/js/libs/stats.min.js"></script>
    <script src="{% static 'particles.js' %}"></script>
</body>
</html>
